[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# solc_version = "0.8.24"
solc = "D:\\Codex\\.foundry\\bin\\solc.exe"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
sepolia = "${RPC_URL}"
ethereum = "${RPC_URL_MAINNET}"

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 15

